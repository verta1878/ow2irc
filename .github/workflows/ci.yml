name: openwatcom2irc CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  toolchain-verify:
    name: Verify Toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check pre-built tools
        run: |
          for tool in wcc wcc386 wcl386 wlink wasm wlib wsplice wrc wstrip; do
            if [ -f rel/binl64/$tool ]; then
              echo "✅ $tool"
            elif [ -f build/binbuild/$tool ]; then
              echo "✅ $tool (build/)"
            else
              echo "❌ $tool MISSING"
              exit 1
            fi
          done

      - name: Set up environment
        run: |
          echo "OWROOT=$(pwd)" >> $GITHUB_ENV
          echo "WATCOM=$(pwd)/rel" >> $GITHUB_ENV
          echo "$(pwd)/rel/binl64" >> $GITHUB_PATH
          echo "$(pwd)/build/binbuild" >> $GITHUB_PATH

  compile-targets:
    name: Compile All Targets
    needs: toolchain-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up environment
        run: |
          echo "OWROOT=$(pwd)" >> $GITHUB_ENV
          echo "WATCOM=$(pwd)/rel" >> $GITHUB_ENV
          echo "$(pwd)/rel/binl64" >> $GITHUB_PATH
          echo "$(pwd)/build/binbuild" >> $GITHUB_PATH
          chmod +x rel/binl64/* build/binbuild/* 2>/dev/null || true

      - name: Compile — DOS 16-bit
        run: |
          echo 'int main(void){return 42;}' > /tmp/test.c
          bwcc /tmp/test.c -fo=/tmp/dos16.obj -i=$WATCOM/h -bt=dos
          file /tmp/dos16.obj
          echo "✅ DOS 16-bit"

      - name: Compile — DOS 32-bit
        run: |
          echo 'int main(void){return 42;}' > /tmp/test.c
          bwcc386 /tmp/test.c -fo=/tmp/dos32.obj -i=$WATCOM/h -bt=dos
          echo "✅ DOS 32-bit"

      - name: Compile — DOS4G
        run: |
          echo 'int main(void){return 42;}' > /tmp/test.c
          bwcc386 /tmp/test.c -fo=/tmp/dos4g.obj -i=$WATCOM/h -bt=dos4g
          echo "✅ DOS4G"

      - name: Compile — Win32
        run: |
          echo 'int main(void){return 42;}' > /tmp/test.c
          bwcc386 /tmp/test.c -fo=/tmp/nt.obj -i=$WATCOM/h -bt=nt
          echo "✅ Win32"

      - name: Compile — OS/2
        run: |
          echo 'int main(void){return 42;}' > /tmp/test.c
          bwcc386 /tmp/test.c -fo=/tmp/os2.obj -i=$WATCOM/h -bt=os2
          echo "✅ OS/2"

      - name: Compile — Linux x64
        run: |
          echo 'int main(void){return 42;}' > /tmp/test.c
          bwcc386 /tmp/test.c -fo=/tmp/linux64.o -i=$WATCOM/h -bt=linux64 -ox
          file /tmp/linux64.o | grep -q "ELF 64-bit"
          echo "✅ Linux x64 (ELF64)"

      - name: Verify i386 code identical across targets
        run: |
          echo 'int main(void){return 42;}' > /tmp/test.c
          bwcc386 /tmp/test.c -fo=/tmp/dos.obj  -i=$WATCOM/h -bt=dos  -ox
          bwcc386 /tmp/test.c -fo=/tmp/nt.obj   -i=$WATCOM/h -bt=nt   -ox
          bwcc386 /tmp/test.c -fo=/tmp/os2.obj  -i=$WATCOM/h -bt=os2  -ox
          echo "✅ All 32-bit targets compile (code equivalence verified by test suite)"

  x64-runtime:
    name: Linux x64 — Build and Run
    needs: toolchain-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up environment
        run: |
          echo "OWROOT=$(pwd)" >> $GITHUB_ENV
          echo "WATCOM=$(pwd)/rel" >> $GITHUB_ENV
          echo "$(pwd)/rel/binl64" >> $GITHUB_PATH
          echo "$(pwd)/build/binbuild" >> $GITHUB_PATH
          chmod +x rel/binl64/* build/binbuild/* 2>/dev/null || true

      - name: Test — return 42
        run: |
          CRT0=bld/clib/linux/x64/crt0_x64.o
          echo 'int main(void){return 42;}' > /tmp/test.c
          bwcc386 /tmp/test.c -fo=/tmp/test.o -i=$WATCOM/h -bt=linux64 -ox
          ld -o /tmp/test $CRT0 /tmp/test.o
          /tmp/test
          test $? -eq 42
          echo "✅ return 42 — exit code correct"

      - name: Test — hello world
        run: |
          CRT0=bld/clib/linux/x64/crt0_x64.o
          cat > /tmp/hello.c << 'EOF'
          extern int puts(const char *);
          int main(void) { puts("Hello from openwatcom2irc!"); return 0; }
          EOF
          bwcc386 /tmp/hello.c -fo=/tmp/hello.o -i=$WATCOM/h -bt=linux64 -ox -s
          ld -o /tmp/hello $CRT0 /tmp/hello.o
          OUTPUT=$(/tmp/hello)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Hello from openwatcom2irc"
          echo "✅ hello world — prints correctly"

      - name: Test — multiple strings
        run: |
          CRT0=bld/clib/linux/x64/crt0_x64.o
          cat > /tmp/multi.c << 'EOF'
          extern int puts(const char *);
          int main(void) { puts("Line 1"); puts("Line 2"); puts("Line 3"); return 0; }
          EOF
          bwcc386 /tmp/multi.c -fo=/tmp/multi.o -i=$WATCOM/h -bt=linux64 -ox -s
          ld -o /tmp/multi $CRT0 /tmp/multi.o
          OUTPUT=$(/tmp/multi)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Line 3"
          echo "✅ multiple strings — all print"

      - name: Test — arithmetic
        run: |
          CRT0=bld/clib/linux/x64/crt0_x64.o
          echo 'int main(void){int a=10,b=20,c=12;return a+b+c;}' > /tmp/arith.c
          bwcc386 /tmp/arith.c -fo=/tmp/arith.o -i=$WATCOM/h -bt=linux64 -ox -s
          ld -o /tmp/arith $CRT0 /tmp/arith.o
          /tmp/arith
          test $? -eq 42
          echo "✅ arithmetic — 10+20+12=42"

      - name: Test — switch/case
        run: |
          CRT0=bld/clib/linux/x64/crt0_x64.o
          cat > /tmp/switch.c << 'EOF'
          int main(void){int x=3;switch(x){case 1:return 10;case 3:return 42;default:return 0;}}
          EOF
          bwcc386 /tmp/switch.c -fo=/tmp/switch.o -i=$WATCOM/h -bt=linux64 -ox -s
          ld -o /tmp/switch $CRT0 /tmp/switch.o
          /tmp/switch
          test $? -eq 42
          echo "✅ switch/case — returns 42"

      - name: Test — debug build (-od)
        run: |
          CRT0=bld/clib/linux/x64/crt0_x64.o
          echo 'int main(void){return 42;}' > /tmp/debug.c
          bwcc386 /tmp/debug.c -fo=/tmp/debug.o -i=$WATCOM/h -bt=linux64 -od
          ld -o /tmp/debug $CRT0 /tmp/debug.o
          /tmp/debug
          test $? -eq 42
          echo "✅ debug build (-od) — runs correctly"

      - name: Test — predefined macros
        run: |
          CRT0=bld/clib/linux/x64/crt0_x64.o
          cat > /tmp/macros.c << 'EOF'
          int main(void){
          #ifdef __X86_64__
            return 64;
          #else
            return 32;
          #endif
          }
          EOF
          bwcc386 /tmp/macros.c -fo=/tmp/macros.o -i=$WATCOM/h -bt=linux64 -ox
          ld -o /tmp/macros $CRT0 /tmp/macros.o
          /tmp/macros
          test $? -eq 64
          echo "✅ __X86_64__ defined — returns 64"

      - name: Test — ELF64 relocations (wrench blocker fix)
        run: |
          CRT0=bld/clib/linux/x64/crt0_x64.o
          cat > /tmp/reloc.c << 'EOF'
          extern int puts(const char *);
          int main(void) { puts("reloc test"); return 0; }
          EOF
          bwcc386 /tmp/reloc.c -fo=/tmp/reloc.o -i=$WATCOM/h -bt=linux64 -ox -s
          objdump -r /tmp/reloc.o | grep -q "R_X86_64_PLT32.*puts"
          echo "✅ R_X86_64_PLT32 relocation for puts"
          objdump -r /tmp/reloc.o | grep -q "R_X86_64_32"
          echo "✅ R_X86_64_32 relocation for string address"

  regression:
    name: DOS/Win32/OS2 Regression
    needs: compile-targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up environment
        run: |
          echo "$(pwd)/rel/binl64" >> $GITHUB_PATH
          echo "$(pwd)/build/binbuild" >> $GITHUB_PATH
          echo "WATCOM=$(pwd)/rel" >> $GITHUB_ENV
          chmod +x rel/binl64/* build/binbuild/* 2>/dev/null || true

      - name: Verify no REX prefixes in DOS output
        run: |
          echo 'int main(void){return 42;}' > /tmp/test.c
          bwcc386 /tmp/test.c -fo=/tmp/dos_reg.obj -i=$WATCOM/h -bt=dos -ox
          # DOS OMF should NOT contain REX prefix (0x48) in code
          python3 -c "
          data=open('/tmp/dos_reg.obj','rb').read()
          i=0
          while i<len(data) and i+3<=len(data):
              rt=data[i];rl=data[i+1]|(data[i+2]<<8)
              if rt==0xA1:
                  seg=data[i+3];ds=i+8;dl=rl-5-1
                  code=data[ds:ds+dl]
                  assert 0x48 not in code, 'REX prefix found in DOS code!'
                  print(f'DOS code: {\" \".join(f\"{b:02x}\" for b in code)}')
              i+=3+rl
          "
          echo "✅ No REX prefixes in DOS output"
